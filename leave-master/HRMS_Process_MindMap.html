<title>HR Payroll System — Process Mind Map</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;overflow:hidden;height:100vh;width:100vw}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:#fff;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;padding:0 20px;gap:14px;z-index:100}
#topbar h1{font-size:15px;font-weight:500;color:#1a1a1a;white-space:nowrap}
.legend{display:flex;gap:10px;margin-left:12px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#666}
.ld{width:8px;height:8px;border-radius:50%}
#side-panel{position:fixed;top:52px;right:0;bottom:0;width:400px;background:#fff;border-left:1px solid #e5e5e0;z-index:90;display:flex;flex-direction:column}
#panel-header{padding:14px 18px 10px;border-bottom:1px solid #f0f0ec}
#panel-header p{font-size:12px;font-weight:600;color:#888;letter-spacing:0.05em;text-transform:uppercase}
#panel-body{padding:16px 18px;flex:1;overflow-y:auto}
#panel-title{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.4;display:none}
#panel-detail{font-size:14px;color:#1a1a1a;line-height:1.8;display:none}
#panel-detail ul{margin:6px 0 0 0;padding-left:18px}
#panel-detail li{margin-bottom:4px}
#panel-detail .freq{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:10px;letter-spacing:0.03em}
#panel-default{font-size:14px;color:#888;line-height:1.8;padding-top:4px}
#canvas-wrap{position:fixed;top:52px;left:0;right:400px;bottom:0;overflow:hidden;cursor:grab}
#canvas-wrap.dragging{cursor:grabbing}
svg#map{position:absolute;top:0;left:0}
#controls{position:fixed;bottom:24px;right:416px;display:flex;flex-direction:column;gap:6px;z-index:100}
.ctrl-btn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:#444;user-select:none}
.ctrl-btn:hover{background:#f0f0ec}
</style>

const HR_TREE={id:'hr-root',label:'HR actions',type:'root',seq:null,
  detail:d('Monthly cycle','All HR responsibilities in the monthly HRMS cycle. Follow phases in sequence ① through ⑮.'.split('.')),
  children:[
  {id:'hr1',label:'Employee master\nmaintenance',type:'emp',seq:'①',
    detail:d('As needed',['Perform when an employee joins, changes role, or exits.','Not part of the monthly cycle — can happen any time.']),
    children:[
      {id:'hr1a',label:'Add new employee',type:'emp',seq:null,detail:d('As needed',['Fill all required columns: Name, Gender, Category, Department, Designation, D.O.J.','Enter bank details, PF/ESI applicability.','System auto-fills ID.NO (BUT-XXXX), STATUS, SKILL GROUP, AGE, SALARY ADVANCE STATUS via formula.'])},
      {id:'hr1b',label:'Update details',type:'emp',seq:null,detail:d('As needed',['Update any changed field directly in Employee Master.','Formula columns (STATUS, SKILL GROUP, AGE, SALARY ADVANCE STATUS) auto-refresh immediately.'])},
      {id:'hr1c',label:'Mark inactive',type:'emp',seq:null,detail:d('As needed',['Mark STATUS = INACTIVE only if employee has zero payroll working days in the current month.','Verify SALARY ADVANCE STATUS is clear (no active EMI balance) before changing status.'])},
    ]},
  {id:'hr2',label:'Salary advance master\n(as and when)',type:'adv',seq:'②',
    detail:d('As and when — on advance payment',['Raise salary advance as and when needed during the month.','Intimate Nazneen mam to schedule EMI immediately after filling the ledger.']),
    children:[
      {id:'hr2a',label:'Fill advance ledger',type:'adv',seq:null,detail:d('As and when',['Enter: Advance Amount, Advance Paid Month, EMI Start Month, Tenure (months).','Set STATUS = ACTIVE.','Leave EMI Reference Number and EMI Scheduled Status blank — system fills on Schedule EMI run.'])},
      {id:'hr2b',label:'Intimate Nazneen mam\nto schedule EMI',type:'adv',seq:null,detail:d('As and when',['After filling advance ledger, immediately inform Nazneen mam.','She opens Salary Advance Master → Advance menu → Schedule EMI.','All-or-nothing: one invalid row stops the entire run.'])},
    ]},
  {id:'hr3',label:'Salary revision\n(if applicable)',type:'rev',seq:'③',
    detail:d('As needed / end of month check',['Submit revision any time during the month when needed.','Also check again at Phase ⑪ (end of month) before payroll lock.']),
    children:[
      {id:'hr3a',label:'Fill HR_UPDATE sheet',type:'rev',seq:null,detail:d('As needed',['Enter revised salary components: Basic, DA, HRA, Conveyance, Special Allowance, Increment.','Fill in the HR_UPDATE sheet of the Salary Revision spreadsheet.'])},
      {id:'hr3b',label:'Submit for approval',type:'rev',seq:null,detail:d('As needed',['Click Submit button — system sends approval mail to approver.','Physical salary revision document must be signed by Zafar sir before system approval.','This is not a digital-only process.'])},
      {id:'hr3c',label:'Fill petrol conveyance',type:'rev',seq:null,detail:d('As needed',['Enter conveyance amount in PETROL_CONVEYANCE_HISTORY sheet.','Same approval flow: physical sign from Zafar sir → approver sets APPROVAL_STATUS = APPROVED.'])},
    ]},
  {id:'hr4',label:'Generate attendance\nfile',type:'ctl',seq:'④',
    detail:d('Monthly — once at start of month',['Generate the monthly attendance file from Attendance Control Center.','Always open the file via the control center link — never search in Google Drive.']),
    children:[
      {id:'hr4a',label:'Open Attendance\nControl Center',type:'ctl',seq:null,detail:d('Monthly',['Open the Attendance Control Center spreadsheet.','This is the master register of all monthly attendance files.'])},
      {id:'hr4b',label:'Generate monthly\nattendance file',type:'ctl',seq:null,detail:d('Monthly',['Enter MONTH (from dropdown) and YEAR (4 digits) in the next blank row.','Click Attendance Control menu → Generate Attendance File.','System creates the file, names it Attendance_Month_Year, records FILE_ID.','Sequential order enforced — cannot skip months.'])},
      {id:'hr4c',label:'Click month link\nto open file',type:'ctl',seq:null,detail:d('Monthly',['Click the FILE_ID hyperlink in the control center row.','Always use this link — do not open the attendance file from Drive search or a bookmark.'])},
    ]},
  {id:'hr5',label:'Monthly attendance\ninputs',type:'att',seq:'⑤',
    detail:d('Monthly',['Main monthly attendance data entry phase.','Begin with Refresh Month, then fill all attendance tabs in order.']),
    children:[
      {id:'hr5a',label:'Refresh month',type:'att',seq:null,detail:d('Monthly — once',['Run Refresh Month before any data entry.','Clears: Employee Code, Carry Forwarded columns, Other Payments inputs, Other Deductions inputs, SA Run Timestamp, approved leave columns.','Preserves: formula columns, roster data (Name, Dept, Designation).'])},
      {id:'hr5b',label:'Fill attendance entry',type:'att',seq:null,detail:d('Daily',['Fill daily attendance marks for each employee.','TOTAL WORKING DAYS: must be > 0.','TOTAL PRESENT DAYS: can be 0.','LOP DAYS: must be ≥ 0.','FINAL PAYABLE DAYS: must be ≥ 0 and ≤ TOTAL WORKING DAYS.'])},
      {id:'hr5c',label:'Fill late entry',type:'att',seq:null,detail:d('Daily',['Navigate to Late Entry tab.','Allowed values per day: blank (on time), numeric minutes (e.g. 45), P60 (permitted 60 min), P120 (permitted 120 min — STAFF only).','WO is auto-filled for Sundays.','Custom formula validation enforces allowed values.'])},
      {id:'hr5d',label:'Fill OT entry',type:'att',seq:null,detail:d('As needed',['Navigate to OT Entry tab.','Enter one row per OT instance: DATE (MM/DD/YY), EMPLOYEE CODE, OT START, OT END, OT PURPOSE.','Cleared by Refresh Month.'])},
    ]},
  {id:'hr6',label:'Mid-month if needed:\nsync / remove',type:'att',seq:'⑥',
    detail:d('As needed — must be BEFORE Get Leave Balances',['Sync New Employees and Remove Inactive Employee must be done before Get Leave Balances.','Both are permanently blocked after the file is locked.']),
    children:[
      {id:'hr6a',label:'Sync new employee',type:'att',seq:null,detail:d('As needed',['Run if a new employee joins mid-month.','Prerequisite: Refresh Month must have been run first.','Blocked after file lock — error: "This attendance file is LOCKED. Sync New Employees is not allowed."'])},
      {id:'hr6b',label:'Remove employee',type:'att',seq:null,detail:d('As needed',['First mark STATUS = INACTIVE in Employee Master.','Then run Remove Inactive Employee from the menu.','Blocked after file lock — error: "This attendance file is LOCKED. Removing an employee is not allowed."'])},
    ]},
  {id:'hr7',label:'End of month:\nfinal attendance inputs',type:'att',seq:'⑦',
    detail:d('Monthly — end of month',['Complete all remaining attendance inputs before calculating late penalty and locking the file.']),
    children:[
      {id:'hr7a',label:'Fill carry forwarded',type:'att',seq:null,detail:d('Monthly — end of month',['Navigate to Carry Forwarded tab.','Enter: Employee Code, Carry Forwarded Days, CF From Month [MM/DD/YY], CF Type, Remarks.','Each entry must have supporting evidence.'])},
      {id:'hr7b',label:'Fill other payments',type:'att',seq:null,detail:d('As needed',['Navigate to Other Payments tab.','Enter: EMPLOYEE CODE, PAYMENT TYPE, AMOUNT, MONTH APPLICABLE [MM/DD/YY], REMARKS, APPROVED BY.'])},
      {id:'hr7c',label:'Fill other deductions',type:'att',seq:null,detail:d('As needed',['Navigate to Other Deductions tab.','Enter: EMPLOYEE CODE, AMOUNT, REMARKS.'])},
    ]},
  {id:'hr8',label:'Calculate late\npenalty',type:'att',seq:'⑧',
    detail:d('Monthly — once',['Must be run from the Late Entry sheet tab only.','Run before Get Leave Balances.','Result (LATE PENALTY COUNT) is protected after calculation.']),
    children:[
      {id:'hr8a',label:'Navigate to\nLate Entry tab',type:'att',seq:null,detail:d('Monthly',['Click the "Late Entry" sheet tab at the bottom of the attendance file.','Do not run from any other tab — error: "Please run this function from the Late Entry sheet only."'])},
      {id:'hr8b',label:'Run Calculate\nLate Penalty',type:'att',seq:null,detail:d('Monthly — once',['Click Leave menu → Calculate late penalty.','Worker: 1 permitted slot (P60) per month.','Staff: 2 permitted slots (P120 once or P60 twice).','Writes LATE PENALTY COUNT per employee.','Column is protected after calculation.'])},
    ]},
  {id:'hr9',label:'Get Leave Balances\n— LOCKS the file',type:'crit',seq:'⑨',
    detail:d('Monthly — once, irreversible',['CRITICAL ONE-TIME ACTION — permanently locks the attendance file.','Cannot be undone.','All data entry, sync, remove, and late penalty must be complete before running this.']),
    children:[
      {id:'hr9a',label:'Verify all data\nis complete',type:'crit',seq:null,detail:d('Monthly',['Confirm before running: all attendance marks entered and reviewed.','Late entry data filled.','OT, Other Payments, Other Deductions, Carry Forwarded complete.','Sync New Employees and Remove Inactive done if required.','Late Penalty calculated.'])},
      {id:'hr9b',label:'Run Get\nLeave Balances',type:'crit',seq:null,detail:d('Monthly — once',['Click Leave menu → Get Leave Balances.','Confirmation dialog: "Shall I lock the file and fetch leave balances? (This action is ONE TIME only.)" — click YES.','System fetches leave balances from Leave Master → writes to Leave Balances sheet.','Fills and protects LOCKED STATUS column.','Protects Leave Balances sheet.'])},
      {id:'hr9c',label:'File is now locked',type:'crit',seq:null,detail:d('Monthly',['LOCKED STATUS column filled with timestamp and protected.','Refresh Month is blocked.','Sync New Employees is blocked.','Remove Inactive Employee is blocked.','Get Leave Balances cannot be run again.','Salary Advance Get EMI is now ENABLED.'])},
      {id:'hr9d',label:'Fill approved\nleave columns',type:'att',seq:null,detail:d('Monthly — after lock',['Now fill approved leave columns in Attendance entry tab.','APPROVED EL DAYS: enter approved earned leave days per employee.','APPROVED SL DAYS: enter approved sick leave days per employee.','APPROVED CL DAYS: enter approved casual leave days per employee.','MANAGEMENT APPROVAL FOR LONG LEAVES: set APPROVED or leave blank.'])},
    ]},
  {id:'hr10',label:'Salary advance\ndeductions',type:'adv',seq:'⑩',
    detail:d('Monthly — once',['Salary Advance Get EMI can ONLY run after file is locked (Get Leave Balances completed).','Blocked if attendance not locked.']),
    children:[
      {id:'hr10a',label:'Check: new EMI\nto schedule?',type:'adv',seq:null,detail:d('Monthly',['Before running Get EMI — confirm with Nazneen mam if any new advance EMI needs scheduling first.','Do not run Get EMI if a new advance is pending schedule in the master.'])},
      {id:'hr10b',label:'Navigate to Salary\nAdvance deductions tab',type:'adv',seq:null,detail:d('Monthly',['Click "Salary Advance deductions" tab at the bottom of the attendance file.','Both Get EMI and Refresh EMI buttons must be run from this tab only.','Error if wrong tab: "Please run this button from Salary Advance deductions sheet only."'])},
      {id:'hr10c',label:'Run Get EMI',type:'adv',seq:null,detail:d('Monthly — once',['Click Salary Advance → Get Salary Advance EMI.','Requires attendance LOCKED.','Loads snapshot from Master Shared EMI Summary for this month.','Writes: Month, Employee Code, Name, Department, EMI Reference Number, EMI Amount, Current Balance.','Also writes SA Run Timestamp.'])},
      {id:'hr10d',label:'Fill HR decision',type:'adv',seq:null,detail:d('Monthly',['For each EMI row, fill HR Decision column.','Leave blank: normal deduction proceeds.','SKIP: skip this month EMI.','RESIGNED: employee resigned — write off future EMIs.','ABSCOND: absconded — write off future EMIs.'])},
    ]},
  {id:'hr11',label:'End of month:\nrevision check',type:'rev',seq:'⑪',
    detail:d('Monthly — end of month',['Final check before generating payroll workings.','Confirm no pending salary revision, fixation, or petrol conveyance approval.']),
    children:[
      {id:'hr11a',label:'Any salary revision /\nfixation pending?',type:'rev',seq:null,detail:d('Monthly',['Review if any employee salary revision or fixation needs to be submitted before payroll lock.','Check both HR_UPDATE sheet and PETROL_CONVEYANCE_HISTORY.'])},
      {id:'hr11b',label:'Submit if needed',type:'rev',seq:null,detail:d('As needed',['Fill HR_UPDATE → click Submit → prepare physical document for Zafar sir sign.','Nazneen mam approves in system after physical sign.','Complete fully before proceeding to payroll workings generation.'])},
    ]},
  {id:'hr12',label:'Generate payroll\nworkings file',type:'ctl',seq:'⑫',
    detail:d('Monthly — once',['HR generates the monthly payroll workings file from Payroll Control Center.','Always open via the control center link — never from a direct bookmark.']),
    children:[
      {id:'hr12a',label:'Open Payroll\nControl Center',type:'ctl',seq:null,detail:d('Monthly',['Open the Payroll Control Center spreadsheet.','This is the master register of all monthly payroll workings files.'])},
      {id:'hr12b',label:'Generate payroll\nworkings',type:'ctl',seq:null,detail:d('Monthly — once',['Enter MONTH and YEAR in the next blank row.','Click Payroll Control menu → Generate Payroll Workings.','System creates the file and records FILE_ID and metadata.'])},
      {id:'hr12c',label:'Click month link\nto open file',type:'ctl',seq:null,detail:d('Monthly',['Click the payroll workings file hyperlink for the current month.','Always open from this link — do not bookmark the payroll file directly.'])},
    ]},
  {id:'hr13',label:'Payroll data\nprocessing',type:'pay',seq:'⑬',
    detail:d('Monthly',['HR runs Validate Attendance and Get Payroll Data in the payroll workings file.','First-time Google authorization required.']),

const FREQ_COLORS={
  'Monthly':{bg:'#EAF3FC',color:'#0C447C'},
  'Monthly — once':{bg:'#EAF3FC',color:'#0C447C'},
  'Monthly — once, irreversible':{bg:'#FDEDED',color:'#501313'},
  'Monthly — end of month':{bg:'#EAF3FC',color:'#0C447C'},
  'Monthly — before payroll':{bg:'#EAF3FC',color:'#0C447C'},
  'Monthly — before lock':{bg:'#FDEDED',color:'#501313'},
  'Monthly — after lock':{bg:'#E8F8F2',color:'#085041'},
  'Monthly — if issue found':{bg:'#FDEDED',color:'#501313'},
  'Monthly cycle':{bg:'#EAF3FC',color:'#0C447C'},
  'Daily':{bg:'#E8F8F2',color:'#085041'},
  'As needed':{bg:'#F2F1EC',color:'#444441'},
  'As and when — on bank payment':{bg:'#FEF3E2',color:'#633806'},
  'As and when — on mail receipt':{bg:'#FDEEF5',color:'#4B1528'},
  'As and when — after approval':{bg:'#FDEEF5',color:'#4B1528'},
  'As and when':{bg:'#FEF3E2',color:'#633806'},
  'As needed / end of month check':{bg:'#F2F1EC',color:'#444441'},
};

const svg=document.getElementById('map');
const wrap=document.getElementById('canvas-wrap');
let scale=1,tx=60,ty=70,dragging=false,lastX,lastY;
const expanded=new Set();
const positions={};
const NODE_W=150,NODE_H=36,GAP_X=52,GAP_Y=11;

function mkEl(tag){return document.createElementNS('http://www.w3.org/2000/svg',tag)}

function nodeHeight(node){
  if(!expanded.has(node.id)||!node.children||!node.children.length)return NODE_H;
  let h=node.children.reduce((a,ch)=>a+nodeHeight(ch)+GAP_Y,0)-GAP_Y;
  return Math.max(h,NODE_H);
}

function layoutTree(tree,startY){
  const result=[];
  function walk(node,x,y,parentId){
    result.push({node,x,y,parentId});
    positions[node.id]={x,y};
    if(node.children&&expanded.has(node.id)){
      const cx=x+NODE_W+GAP_X;let cy=y;
      node.children.forEach(ch=>{walk(ch,cx,cy,node.id);cy+=nodeHeight(ch)+GAP_Y;});
    }
  }
  walk(tree,0,startY,null);
  return result;
}

function showPanel(node){
  const col=C[node.type]||C.ctl;
  document.getElementById('panel-default').style.display='none';
  const pt=document.getElementById('panel-title');
  const pd=document.getElementById('panel-detail');
  pt.textContent=node.label.replace('\n',' ');
  pt.style.color=col.stroke;
  pt.style.display='block';
  const det=node.detail;
  if(!det){pd.style.display='none';return;}
  const fc=FREQ_COLORS[det.freq]||{bg:'#F2F1EC',color:'#444441'};
  let html=`<span class="freq" style="background:${fc.bg};color:${fc.color}">${det.freq}</span>`;
  html+=`<ul>${det.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  pd.innerHTML=html;
  pd.style.display='block';
}

function render(){
  svg.innerHTML='';
  const hrItems=layoutTree(HR_TREE,0);
  const hrH=nodeHeight(HR_TREE);
  const admStartY=hrH+90;
  const admItems=layoutTree(ADM_TREE,admStartY);

  const sep=mkEl('line');
  sep.setAttribute('x1',0);sep.setAttribute('y1',admStartY-44);
  sep.setAttribute('x2',1000);sep.setAttribute('y2',admStartY-44);
  sep.setAttribute('stroke','#ddd');sep.setAttribute('stroke-width','1');
  sep.setAttribute('stroke-dasharray','6 4');
  svg.appendChild(sep);

  [['HR ACTIONS — MONTHLY CYCLE (① – ⑮)',0-28,'#7F77DD'],
   ['ADMIN ACTIONS — MONTHLY CYCLE (① – ⑦)',admStartY-28,'#378ADD']
  ].forEach(([label,y,color])=>{
    const t=mkEl('text');
    t.setAttribute('x',0);t.setAttribute('y',y);
    t.setAttribute('fill',color);t.setAttribute('font-size','11');
    t.setAttribute('font-weight','600');t.setAttribute('letter-spacing','0.04em');
    t.textContent=label;svg.appendChild(t);
  });

  [...hrItems,...admItems].forEach(({node,x,y,parentId})=>{
    if(parentId===null)return;
    const px=positions[parentId];if(!px)return;
    const x1=px.x+NODE_W,y1=px.y+NODE_H/2,x2=x,y2=y+NODE_H/2,mx=(x1+x2)/2;
    const p=mkEl('path');
    p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute('fill','none');
    p.setAttribute('stroke',C[node.type]?.stroke||'#aaa');
    p.setAttribute('stroke-width','1.5');p.setAttribute('opacity','0.55');
    svg.appendChild(p);
  });

  [...hrItems,...admItems].forEach(({node,x,y})=>drawNode(node,x,y));
  const allItems=[...hrItems,...admItems];
  svg.setAttribute('width',Math.max(...allItems.map(i=>i.x))+NODE_W+80);
  svg.setAttribute('height',Math.max(...allItems.map(i=>i.y))+NODE_H+80);
  applyTransform();
}

function drawNode(node,x,y){
  const col=C[node.type]||C.ctl;
  const g=mkEl('g');g.style.cursor='pointer';
  const rect=mkEl('rect');
  rect.setAttribute('x',x);rect.setAttribute('y',y);
  rect.setAttribute('width',NODE_W);rect.setAttribute('height',NODE_H);
  rect.setAttribute('rx','18');rect.setAttribute('fill',col.fill);
  rect.setAttribute('stroke',col.stroke);rect.setAttribute('stroke-width','1.2');
  g.appendChild(rect);
  if(node.seq){
    const bc=mkEl('circle');bc.setAttribute('cx',x+14);bc.setAttribute('cy',y+18);bc.setAttribute('r','9');bc.setAttribute('fill',col.stroke);g.appendChild(bc);
    const bt=mkEl('text');bt.setAttribute('x',x+14);bt.setAttribute('y',y+18);bt.setAttribute('fill','#fff');bt.setAttribute('font-size','8');bt.setAttribute('text-anchor','middle');bt.setAttribute('dominant-baseline','middle');bt.textContent=node.seq;g.appendChild(bt);
  }
  const lines=node.label.split('\n');
  const lx=node.seq?x+NODE_W/2+6:x+NODE_W/2;
  lines.forEach((line,i)=>{
    const t=mkEl('text');t.setAttribute('x',lx);t.setAttribute('y',y+NODE_H/2+(i-(lines.length-1)/2)*13);t.setAttribute('fill',col.text);t.setAttribute('font-size','11');t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.textContent=line;g.appendChild(t);
  });
  if(node.children&&node.children.length){
    const bx=x+NODE_W-12,by=y+NODE_H/2;
    const bc=mkEl('circle');bc.setAttribute('cx',bx);bc.setAttribute('cy',by);bc.setAttribute('r','8');bc.setAttribute('fill',col.stroke);g.appendChild(bc);
    const bt=mkEl('text');bt.setAttribute('x',bx);bt.setAttribute('y',by);bt.setAttribute('fill','#fff');bt.setAttribute('font-size','11');bt.setAttribute('text-anchor','middle');bt.setAttribute('dominant-baseline','middle');bt.textContent=expanded.has(node.id)?'‹':'›';g.appendChild(bt);
  }
  g.addEventListener('click',()=>{
    if(!node.children||!node.children.length)return;
    expanded.has(node.id)?expanded.delete(node.id):expanded.add(node.id);render();
  });
  g.addEventListener('mouseenter',()=>showPanel(node));
  svg.appendChild(g);
}

function applyTransform(){svg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;svg.style.transformOrigin='0 0';}
function zoom(f){scale=Math.min(Math.max(scale*f,0.25),3);applyTransform();}
function resetView(){scale=1;tx=60;ty=70;applyTransform();}

wrap.addEventListener('mousedown',e=>{if(e.target.closest('g'))return;dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('dragging');});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform();});
window.addEventListener('mouseup',()=>{dragging=false;wrap.classList.remove('dragging');});
wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.9);},{passive:false});
let lTX,lTY;
wrap.addEventListener('touchstart',e=>{lTX=e.touches[0].clientX;lTY=e.touches[0].clientY;});
wrap.addEventListener('touchmove',e=>{e.preventDefault();tx+=e.touches[0].clientX-lTX;ty+=e.touches[0].clientY-lTY;lTX=e.touches[0].clientX;lTY=e.touches[0].clientY;applyTransform();},{passive:false});

render();
</script>
